name: Build Xuper Hydra Launcher APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android SDK components
      run: |
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
    
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5
    
    - name: Build APK with Gradle 8.5
      run: gradle assembleDebug --stacktrace
    
    - name: List APK files
      run: find . -name "*.apk" -type f
    
    - name: Prepare APK for upload
      run: |
        mkdir -p output
        cp app/build/outputs/apk/debug/app-debug.apk output/XuperHydraLauncher.apk
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: XuperHydraLauncher
        path: output/XuperHydraLauncher.apk
        retention-days: 30
    
    - name: Build summary
      run: |
        echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📦 APK Size: $(du -h output/XuperHydraLauncher.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download from Artifacts section above" >> $GITHUB_STEP_SUMMARY
