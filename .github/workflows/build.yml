name: Build Xuper Hydra Launcher APK

on:
  push:
    branches: [ main, master, principal ]
  pull_request:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.0
    
    - name: Make gradlew executable
      run: chmod +x gradlew || echo "gradlew not found, using gradle command"
    
    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace --info
        else
          gradle assembleDebug --stacktrace --info
        fi
    
    - name: Rename APK
      run: |
        mkdir -p output
        find . -name "*.apk" -type f
        cp app/build/outputs/apk/debug/app-debug.apk output/XuperHydraLauncher.apk || echo "APK not found"
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: XuperHydraLauncher
        path: output/XuperHydraLauncher.apk
        retention-days: 30
    
    - name: Build info
      if: success()
      run: |
        echo "✅ APK compilado exitosamente"
        echo "📦 Tamaño:" $(du -h output/XuperHydraLauncher.apk | cut -f1)
        echo "📱 Descarga desde: Actions → Artifacts"
