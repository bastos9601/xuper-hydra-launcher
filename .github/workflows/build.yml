name: Build Xuper Hydra Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Rename APK
      run: |
        mkdir -p output
        cp app/build/outputs/apk/debug/app-debug.apk output/XuperHydraLauncher.apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: XuperHydraLauncher
        path: output/XuperHydraLauncher.apk
        retention-days: 30
    
    - name: Build info
      run: |
        echo "✅ APK compilado exitosamente"
        echo "📦 Tamaño:" $(du -h output/XuperHydraLauncher.apk | cut -f1)
        echo "📱 Descarga desde: Actions → Artifacts"
